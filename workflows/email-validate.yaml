version: "3.0"
metadata:
  id: util-validate-email
  name: "Email Validator"
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/util/validate-email, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"email": trigger_payload.body.email, "valid": validate_email(trigger_payload.body.email), "checked_at": now()}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: respond } }
    - { id: f2, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
