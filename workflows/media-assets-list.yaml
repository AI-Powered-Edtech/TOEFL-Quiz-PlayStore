version: "3.0"
metadata:
  id: media-assets-list
  name: "Media assets list by owner/type"
  description: "POST /api/v2/media/assets/list. Body {owner_id,asset_type}. Used for avatar/audio registry."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/media/assets/list, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: query
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: select
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"SELECT id, owner_id, asset_type, url, label, mime_type, created_at FROM user_media_assets WHERE owner_id = '\" + trigger_payload.body.owner_id + \"' AND asset_type = '\" + trigger_payload.body.asset_type + \"' ORDER BY created_at DESC LIMIT 50\""
      output_variable: query_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"assets": query_result.rows, "count": query_result.row_count}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: query } }
    - { id: f2, from: { node: query }, to: { node: respond } }
    - { id: f3, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: query_result, type: object }
