version: "3.0"
metadata:
  id: oracle-prediction-save
  name: "Oracle: save prediction history"
  description: "POST /api/v2/oracle/predictions/save. Client validates user_id/test_type and escapes JSON before vil-expr SQL concat."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/oracle/predictions/save, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: insert
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: execute
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"INSERT INTO oracle_prediction_history (id, user_id, test_type, predicted_score, breakdown_json, confidence_level, data_points, created_at) VALUES (lower(hex(randomblob(16))), '\" + trigger_payload.body.user_id + \"', '\" + trigger_payload.body.test_type + \"', \" + trigger_payload.body.predicted_score + \", '\" + trigger_payload.body.breakdown_json + \"', '\" + trigger_payload.body.confidence_level + \"', \" + trigger_payload.body.data_points + \", datetime('now'))\""
      output_variable: insert_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"ok": true, "rows_affected": insert_result.rows_affected, "saved_at": now()}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: insert } }
    - { id: f2, from: { node: insert }, to: { node: respond } }
    - { id: f3, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: insert_result, type: object }
