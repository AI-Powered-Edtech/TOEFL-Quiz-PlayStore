version: "3.0"
metadata:
  id: circle-messages-list
  name: "Circle messaging: list"
  description: "POST /api/v2/social/circles/messages/list. Body {circle_id}."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/social/circles/messages/list, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: query
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: select
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"SELECT id, circle_id, sender_id, message, created_at FROM circle_messages_v2 WHERE circle_id = '\" + trigger_payload.body.circle_id + \"' ORDER BY created_at DESC LIMIT 100\""
      output_variable: query_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"messages": query_result.rows, "count": query_result.row_count}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: query } }
    - { id: f2, from: { node: query }, to: { node: respond } }
    - { id: f3, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: query_result, type: object }
