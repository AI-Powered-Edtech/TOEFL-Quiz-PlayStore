version: "3.0"
metadata:
  id: moderation-reports-admin-list
  name: "Admin: list pending moderation reports"
  description: "GET /api/v2/admin/moderation/reports - top 100 pending reports, newest first. No auth at vwfd layer; rely on AdminAuthGate frontend or reverse-proxy ACL."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/admin/moderation/reports, method: GET }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: query
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: select
      input_mappings:
        - target: sql
          source:
            language: literal
            source: "SELECT id, reporter_id, content_type, content_id, reason, description, status, created_at FROM moderation_reports WHERE status = 'pending' ORDER BY created_at DESC LIMIT 100"
      output_variable: query_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"reports": query_result.rows, "count": query_result.row_count, "queried_at": now()}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: query } }
    - { id: f2, from: { node: query }, to: { node: respond } }
    - { id: f3, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: query_result, type: object }
