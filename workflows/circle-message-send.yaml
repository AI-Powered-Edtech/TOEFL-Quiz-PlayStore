version: "3.0"
metadata:
  id: circle-message-send
  name: "Circle messaging: send"
  description: "POST /api/v2/social/circles/messages. Minimal append-only group chat registry."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/social/circles/messages, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: insert
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: execute
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"INSERT INTO circle_messages_v2 (id, circle_id, sender_id, message, created_at) VALUES (lower(hex(randomblob(16))), '\" + trigger_payload.body.circle_id + \"', '\" + trigger_payload.body.sender_id + \"', '\" + trigger_payload.body.message + \"', datetime('now'))\""
      output_variable: insert_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"ok": true, "rows_affected": insert_result.rows_affected, "sent_at": now()}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: insert } }
    - { id: f2, from: { node: insert }, to: { node: respond } }
    - { id: f3, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: insert_result, type: object }
