version: "3.0"
metadata:
  id: admin-audit-log
  name: "Admin: append audit log"
  description: "POST /api/v2/admin/audit/log. Body strings are validated/sanitized client-side before SQL concat."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/admin/audit/log, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: insert
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: execute
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"INSERT INTO audit_logs (id, actor_id, action, target_type, target_id, metadata, created_at) VALUES (lower(hex(randomblob(16))), '\" + trigger_payload.body.actor_id + \"', '\" + trigger_payload.body.action + \"', '\" + trigger_payload.body.target_type + \"', '\" + trigger_payload.body.target_id + \"', '\" + trigger_payload.body.metadata + \"', datetime('now'))\""
      output_variable: insert_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"ok": true, "rows_affected": insert_result.rows_affected, "created_at": now()}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: insert } }
    - { id: f2, from: { node: insert }, to: { node: respond } }
    - { id: f3, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: insert_result, type: object }
