version: "3.0"
metadata:
  id: creator-payout-request
  name: "Creator Economy: request payout"
  description: "POST /api/v2/creator/payouts. Body {user_id,amount}. Frontend enforces integer min/max and PIN for admin/backoffice actions."
spec:
  activities:
    - id: trigger
      activity_type: Trigger
      trigger_config:
        trigger_type: webhook
        webhook_config: { path: /api/v2/creator/payouts, method: POST }
        response_mode: buffered
        end_activity: respond
      output_variable: trigger_payload
    - id: insert
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: execute
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"INSERT INTO creator_payouts (id, creator_id, amount, status, requested_at) SELECT lower(hex(randomblob(16))), id, \" + trigger_payload.body.amount + \", 'requested', datetime('now') FROM creator_profiles WHERE user_id = '\" + trigger_payload.body.user_id + \"'\""
      output_variable: insert_result
    - id: audit
      activity_type: Connector
      connector_config:
        connector_ref: vastar.db.sqlite
        operation: execute
      input_mappings:
        - target: sql
          source:
            language: vil-expr
            source: "\"INSERT INTO audit_logs (id, actor_id, action, target_type, target_id, metadata, created_at) VALUES (lower(hex(randomblob(16))), '\" + trigger_payload.body.user_id + \"', 'CREATOR_PAYOUT_REQUEST', 'creator_payout', '\" + trigger_payload.body.user_id + \"', '\" + trigger_payload.body.amount + \"', datetime('now'))\""
      output_variable: audit_result
    - id: respond
      activity_type: EndTrigger
      end_trigger_config:
        trigger_ref: trigger
        final_response:
          language: vil-expr
          source: '{"ok": true, "rows_affected": insert_result.rows_affected, "requested_at": now()}'
    - id: end
      activity_type: End
  flows:
    - { id: f1, from: { node: trigger }, to: { node: insert } }
    - { id: f2, from: { node: insert }, to: { node: audit } }
    - { id: f3, from: { node: audit }, to: { node: respond } }
    - { id: f4, from: { node: respond }, to: { node: end } }
  variables:
    - { name: trigger_payload, type: object }
    - { name: insert_result, type: object }
    - { name: audit_result, type: object }
