name: Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional release notes for the artifact summary'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'
      - 'android-v*'

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Node.js 22 (track Node 24 action runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run Rust quality smoke
        run: cargo test --locked

      - name: Decode keystore from secret
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          mkdir -p frontend/android/app
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > frontend/android/app/release.keystore
          test -s frontend/android/app/release.keystore || { echo "::error::decoded keystore is empty"; exit 1; }
          echo "keystore-bytes=$(stat -c%s frontend/android/app/release.keystore)" >> "$GITHUB_OUTPUT"

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for var in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::secret $var is empty"
              exit 1
            fi
          done
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > frontend/android/keystore.properties
          echo "keystore.properties written ($(wc -c < frontend/android/keystore.properties) bytes)"

      - name: Verify production upload certificate fingerprint
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXPECTED_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          DEV_CERT_SHA256="83:33:2C:8C:83:9D:A0:F5:A0:B6:7E:5F:FE:66:59:1D:56:2F:A2:DC:FA:BF:85:32:A7:C5:39:EC:C3:E1:54:29"
          if [ -z "${EXPECTED_UPLOAD_CERT_SHA256}" ]; then
            echo "::error::ANDROID_UPLOAD_CERT_SHA256 secret is required for Play Store production bundles"
            exit 1
          fi
          CERT_SHA256=$(keytool -list -v -keystore frontend/android/app/release.keystore -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}')
          if [ -z "${CERT_SHA256}" ]; then
            echo "::error::could not read upload certificate SHA-256"
            exit 1
          fi
          echo "Upload certificate SHA-256: ${CERT_SHA256}"
          if [ "${CERT_SHA256^^}" = "${DEV_CERT_SHA256^^}" ]; then
            echo "::error::dev keystore detected; generate and configure a Play Store production upload key"
            exit 1
          fi
          if [ "${CERT_SHA256^^}" != "${EXPECTED_UPLOAD_CERT_SHA256^^}" ]; then
            echo "::error::upload certificate fingerprint does not match ANDROID_UPLOAD_CERT_SHA256"
            exit 1
          fi

      - name: Write frontend/.env.production
        run: |
          cat > frontend/.env.production <<'ENVEOF'
          VITE_API_URL=https://api.toeflquiz.id
          VITE_VWFD_URL=https://api.toeflquiz.id
          ENVEOF
          echo "wrote frontend/.env.production ($(wc -c < frontend/.env.production) bytes)"

      - name: Run release-gate (quality + build + sync + bundleRelease)
        env:
          RUN_FRONTEND_LINT: '1'
          RUN_FRONTEND_TESTS: '1'
          RUN_ANDROID_BUNDLE: '1'
        run: bash scripts/android-release-gate.sh

      - name: Locate AAB
        id: locate
        run: |
          AAB=$(find frontend/android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::no AAB produced"
            ls -la frontend/android/app/build/outputs/bundle/ || true
            exit 1
          fi
          echo "aab_path=${AAB}" >> "$GITHUB_OUTPUT"
          echo "aab_size=$(stat -c%s "$AAB")" >> "$GITHUB_OUTPUT"
          echo "AAB: ${AAB} ($(stat -c%s "$AAB") bytes)"

      - name: Print certificate fingerprint
        env:
          AAB_PATH: ${{ steps.locate.outputs.aab_path }}
        run: |
          unzip -p "$AAB_PATH" "META-INF/*.RSA" 2>/dev/null | keytool -printcert | head -20 || \
            echo "::warning::could not print certificate; bundle still signed via Gradle"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.locate.outputs.aab_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup secrets on disk
        if: always()
        run: |
          rm -f frontend/android/app/release.keystore frontend/android/keystore.properties
          echo "cleaned local keystore artifacts"

      - name: Summary
        if: success()
        env:
          NOTES: ${{ inputs.release_notes }}
          AAB_PATH: ${{ steps.locate.outputs.aab_path }}
          AAB_SIZE: ${{ steps.locate.outputs.aab_size }}
          KS_BYTES: ${{ steps.keystore.outputs.keystore-bytes }}
        run: |
          {
            echo "## Android Release Bundle"
            echo ""
            echo "- AAB path: \`${AAB_PATH}\`"
            echo "- AAB size: ${AAB_SIZE} bytes"
            echo "- Keystore size: ${KS_BYTES} bytes"
            if [ -n "${NOTES}" ]; then
              echo ""
              echo "### Notes"
              echo ""
              echo "${NOTES}"
            fi
            echo ""
            echo "> Upload-key fingerprint was verified against `ANDROID_UPLOAD_CERT_SHA256`; this artifact is intended for Play Store upload-key controlled release."
          } >> "$GITHUB_STEP_SUMMARY"
