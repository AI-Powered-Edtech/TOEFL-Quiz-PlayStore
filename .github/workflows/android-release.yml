name: Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional release notes for the artifact summary'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'
      - 'android-v*'

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: frontend/android
          gradle-home-cache-cleanup: true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Decode keystore from secret
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          mkdir -p frontend/android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > frontend/android/release.keystore
          test -s frontend/android/release.keystore || { echo "::error::decoded keystore is empty"; exit 1; }
          echo "keystore-bytes=$(stat -c%s frontend/android/release.keystore)" >> "$GITHUB_OUTPUT"

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::secret $var is empty"
              exit 1
            fi
          done
          {
            echo "storeFile=release.keystore"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > frontend/android/keystore.properties
          echo "keystore.properties written ($(wc -c < frontend/android/keystore.properties) bytes)"

      - name: Run release-gate (build + sync + bundleRelease)
        env:
          RUN_ANDROID_BUNDLE: '1'
        run: bash scripts/android-release-gate.sh

      - name: Locate AAB
        id: locate
        run: |
          AAB=$(find frontend/android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::no AAB produced"
            ls -la frontend/android/app/build/outputs/bundle/ || true
            exit 1
          fi
          echo "aab_path=${AAB}" >> "$GITHUB_OUTPUT"
          echo "aab_size=$(stat -c%s "$AAB")" >> "$GITHUB_OUTPUT"
          echo "AAB: ${AAB} ($(stat -c%s "$AAB") bytes)"

      - name: Print certificate fingerprint
        env:
          AAB_PATH: ${{ steps.locate.outputs.aab_path }}
        run: |
          unzip -p "$AAB_PATH" "META-INF/*.RSA" 2>/dev/null | keytool -printcert | head -20 || \
            echo "::warning::could not print certificate; bundle still signed via Gradle"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: ${{ steps.locate.outputs.aab_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup secrets on disk
        if: always()
        run: |
          rm -f frontend/android/release.keystore frontend/android/keystore.properties
          echo "cleaned local keystore artifacts"

      - name: Summary
        if: success()
        env:
          NOTES: ${{ inputs.release_notes }}
          AAB_PATH: ${{ steps.locate.outputs.aab_path }}
          AAB_SIZE: ${{ steps.locate.outputs.aab_size }}
          KS_BYTES: ${{ steps.keystore.outputs.keystore-bytes }}
        run: |
          {
            echo "## Android Release Bundle"
            echo ""
            echo "- AAB path: \`${AAB_PATH}\`"
            echo "- AAB size: ${AAB_SIZE} bytes"
            echo "- Keystore size: ${KS_BYTES} bytes"
            if [ -n "${NOTES}" ]; then
              echo ""
              echo "### Notes"
              echo ""
              echo "${NOTES}"
            fi
            echo ""
            echo "> NOTE: if the keystore is the Android debug keystore, this AAB cannot be uploaded to Play Store production."
          } >> "$GITHUB_STEP_SUMMARY"
