[package]
name = "toefl-quiz-backend"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
# VIL Framework
vil = { version = "0.4", features = ["web", "log", "ai", "db-sqlite", "vil-orm", "sdk", "ws", "cache"] }
vil_migrate = "0.4"
tracing = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "any"] }

# Auth — VilPassword (argon2id) + VilJwt replace manual deps
async-trait = "0.1"

# HTTP client (for FCM, Slack/Discord webhooks — AI calls move to vil_llm)
reqwest = { version = "0.12", features = ["json"] }

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rmp-serde = "1.3"
base64 = "0.22"
urlencoding = "2.1"
jsonwebtoken = "9"
vil_server = "0.4"
vil_server_core = "0.4"
vil_json = "0.4"
vil_orm = "0.4"
vil_orm_derive = "0.4"
vil_server_macros = "0.4"
sha2 = "0.11.0"


# VIL 0.4.0 — Workflow runtime (VSAL, used under Significant Business Process Exception §3.6)
vil_vwfd = { git = "https://github.com/OceanOS-id/VIL", tag = "v0.4.0", features = ["faas-full", "connectors-db"], optional = true }
vil_vwfd_macros = { git = "https://github.com/OceanOS-id/VIL", tag = "v0.4.0", optional = true }
anyhow = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
vil_server_test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"

[features]
vwfd = ["dep:vil_vwfd", "dep:vil_vwfd_macros", "dep:anyhow", "dep:tracing-subscriber"]

[[bin]]
name = "vwfd-app"
path = "src/bin/vwfd-app.rs"
required-features = ["vwfd"]
