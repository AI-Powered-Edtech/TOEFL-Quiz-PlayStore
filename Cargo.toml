[package]
name = "toefl-quiz-backend"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
# VIL Framework
vil = { version = "0.2.1", features = ["web", "log", "ai", "db-sqlite", "vil-orm", "sdk", "ws", "cache"] }
vil_migrate = "0.2.0"
tracing = "0.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
dotenv = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "any"] }

# Auth — VilPassword (argon2id) + VilJwt replace manual deps
async-trait = "0.1"

# HTTP client (for FCM, Slack/Discord webhooks — AI calls move to vil_llm)
reqwest = { version = "0.12", features = ["json"] }

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rmp-serde = "1.3"
base64 = "0.22"
urlencoding = "2.1"
jsonwebtoken = "9"
vil_server = "0.1.14"
vil_server_core = "0.1.14"
vil_json = "0.1"
vil_orm = "0.1"
vil_orm_derive = "0.1"
vil_server_macros = "0.1"
sha2 = "0.11.0"

# Crash reporting (optional — activated via SENTRY_DSN env var)
sentry = { version = "0.35", features = ["tracing", "panic", "tower"] }

[dev-dependencies]
vil_server_test = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
